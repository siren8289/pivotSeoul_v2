# 로컬 기본값. Docker에서는 compose.yaml의 환경변수가 이 값을 덮어쓴다.
app:
  ai:
    base-url: http://localhost:8000
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

spring:
  # 로컬: H2 메모리 DB (서버를 끄면 기록이 사라진다)
  datasource:
    url: jdbc:h2:mem:pivotseoul;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update   # 엔티티를 보고 테이블을 자동으로 만든다.
    open-in-view: false
