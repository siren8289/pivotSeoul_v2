name: CI

on:
  push:
    branches: [main, 001-ai-housing-rag, refactor/ai-front-back-data]
  pull_request:
    branches: [main, 001-ai-housing-rag]

jobs:
  data:
    name: Data pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/requirements.txt
      - run: pip install -r data/requirements.txt
      - run: python -m pytest data/tests -q

  ai:
    name: AI (FastAPI - RAG & Models)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements-dev.txt
      - run: |
          pip install -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest tests -q

  back:
    name: Backend (Spring)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  front:
    name: Front (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.yaml config --quiet
        env:
          DB_PASSWORD: ci-check
