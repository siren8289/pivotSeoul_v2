server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api 요청은 Spring 컨테이너로 넘긴다. (같은 주소라 CORS 설정이 필요 없다)
    location /api/ {
        proxy_pass http://back:8080;
        proxy_read_timeout 60s;
    }

    # 그 외 주소는 React 화면(index.html)을 보여 준다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
