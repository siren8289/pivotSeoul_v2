# 전체 실행: docker compose up --build
# 접속: http://localhost  (front → back → ai 순서로 연결)
name: pivotseoul

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pivotseoul
      POSTGRES_USER: pivot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 넣어 주세요}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pivot -d pivotseoul"]
      interval: 5s
      retries: 20

  ai:
    build: ./ai
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

  back:
    build: ./back
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pivotseoul
      SPRING_DATASOURCE_USERNAME: pivot
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_AI_BASE_URL: http://ai:8000
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started

  front:
    build: ./front
    ports:
      - "80:80"
    depends_on:
      - back

volumes:
  db-data:
